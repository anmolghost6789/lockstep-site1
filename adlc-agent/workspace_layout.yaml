version: 1.0
purpose: Where everything lives in a repository using the ADLC pack.

package:
  CLAUDE.md: always-on instructions for the orchestrator
  lockstep-pack.json: pack name and description for the Lockstep registry
  .claude/skills/adlc/: shared protocol (hidden), specs, templates, utilities, references, scripts
  .claude/skills/<phase>/SKILL.md: one skill per phase, plus approve-gate, status, cancel, refresh-reference-store
  .claude/agents/: thresholded subagents (requirements-analyst, solution-architect, bolt-builder, adlc-evaluator, release-auditor)
  .claude/hooks/: runtime policy hooks for Claude Code
  .claude/rules/: optional path-scoped rules
  .claude/settings.template.json: project settings to copy to settings.json
  .claude/managed-settings.example.json: org-wide settings to deploy through MDM
  .mcp.json: MCP servers (must be allow-listed in config/governance/mcp_allowlist.json)

configuration:
  config/project_config.json: gate mode, models, thresholds, policy packs, data classification, audit
  config/governance/gate_roles.json: roles, GitHub teams, gate approvers, waivers
  config/governance/mcp_allowlist.json: approved MCP servers, tools and phases
  config/governance/model_policy.json: approved models

guidance:
  context/guidance/{enterprise,domain,project}_context/: durable guidance tiers (precedence in CLAUDE.md)
  context/reference/raw/: material for /refresh-reference-store
  context/reference/processed/: governed reusable patterns
  memory/: governed operational learnings (no client data)

run_inputs:
  inputs/instructions/intent.md: the business goal
  inputs/requirements/: BRDs, process documents, acceptance criteria
  inputs/sources/: system descriptions, API specs, schemas
  inputs/classification.json: optional per-file data classification

lifecycle_record:
  adlc/01-aiprs.md: G1 product owner
  adlc/02-blueprint.md: G2 architect
  adlc/adr/: architecture decision records
  adlc/03-units.yaml: G3 engineer
  adlc/04-scorecard.json: G4 QA lead
  adlc/05-release.md: G5 release manager (+ security officer if high risk)
  adlc/06-backlog.md: G6 product owner
  adlc/.state/: run ledger, packets, handoffs, validation, policy, evidence
  adlc/.gates/: local gate mode only
  adlc/.audit/audit.jsonl: hash-chained audit log
  progress.json: UI projection for the extension
  .github/CODEOWNERS: generated by scripts/setup_codeowners.py

git_ignored:
  - adlc/.state/runtime_scratch/
  - adlc/.state/eval/raw/
  - inputs/** (except README and examples)
